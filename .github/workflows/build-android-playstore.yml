name: Build Signed Android Play Store Bundle (.aab & .apk)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'playstore-release/android-twa/**'
      - '.github/workflows/build-android-playstore.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Android Upload Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/android.keystore"

      - name: Build Signed Play Store Bundle (.aab) and APK (.apk)
        working-directory: playstore-release/android-twa
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore/android.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          (./gradlew bundleRelease assembleRelease --no-daemon || gradle bundleRelease assembleRelease --no-daemon)

      - name: Collect Signed Release Artifacts
        run: |
          mkdir -p release-out
          cp playstore-release/android-twa/app/build/outputs/bundle/release/app-release.aab release-out/ksb-stocks-release.aab
          cp playstore-release/android-twa/app/build/outputs/apk/release/app-release.apk release-out/ksb-stocks-release.apk

      - name: Upload Signed Android Bundle & APK
        uses: actions/upload-artifact@v4
        with:
          name: ksb-stocks-playstore-release
          path: release-out/*
          retention-days: 90
